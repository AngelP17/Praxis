# Production override for docker-compose.yml
#
# Usage (on any VPS/server with Docker Compose v2):
#
#   cp .env.example .env          # fill in real values
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required environment variables (set in .env or the shell):
#   SECRET_KEY       — strong random secret, e.g. openssl rand -base64 32
#   ALLOWED_ORIGINS  — comma-separated public frontend URLs, e.g. https://praxis.example.com
#   POSTGRES_PASSWORD — strong password for the database
#
# Optional:
#   NEXT_PUBLIC_API_URL — public URL of the API gateway (default: http://localhost:8000)
#   API_INTERNAL_URL — internal URL used by the Next.js server proxy (default: http://api-gateway:8000)
#
# Note: Backend services remain on the internal Docker network. Put a reverse
# proxy (Nginx/Caddy) in front of the api-gateway for TLS and public routing.
# This override uses Compose list reset semantics to clear dev-only published
# backend ports while keeping the services reachable on the internal Docker
# network.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: !override []

  api-gateway:
    restart: unless-stopped
    environment:
      ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DATABASE_URL: postgresql://praxis:${POSTGRES_PASSWORD}@postgres:5432/praxis
    ports: !override []

  decision-service:
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://praxis:${POSTGRES_PASSWORD}@postgres:5432/praxis
    ports: !override []

  platform-service:
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://praxis:${POSTGRES_PASSWORD}@postgres:5432/praxis
    ports: !override []

  web:
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api-gateway:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
