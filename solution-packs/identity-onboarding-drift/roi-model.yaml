variables:
  incidents_per_month: 8
  average_minutes_lost_per_incident: 180
  loaded_labor_rate_per_hour: 45
  onboarding_delay_cost_per_hour: 200
  current_triage_minutes: 120
  praxis_triage_minutes: 20

formulas:
  monthly_labor_cost_saved:
    expression: incidents_per_month * ((current_triage_minutes - praxis_triage_minutes) / 60) * loaded_labor_rate_per_hour
    description: Labor hours saved by automated IAM resolution
  monthly_delay_cost_avoided:
    expression: incidents_per_month * (average_minutes_lost_per_incident / 60) * onboarding_delay_cost_per_hour
    description: New hire idle downtime cost avoided
  annual_value:
    expression: 12 * (monthly_labor_cost_saved + monthly_delay_cost_avoided)
    description: Total annual value delivered by Praxis IAM Onboarding Alignment

calculations:
  monthly_labor_cost_saved: 600.00
  monthly_delay_cost_avoided: 4800.00
  monthly_total: 5400.00
  annual_value: 64800.00
