[project]
name = "praxis-pipelines"
version = "0.1.0"
description = "Ingestion and processing pipelines for Praxis"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]
