[project]
name = "praxis-verify"
version = "0.1.0"
description = "Third-party verifier for Praxis proof objects (PPP v0.1)"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
]

[project.scripts]
praxis-verify = "praxis_verify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praxis_verify"]
