[project]
name = "praxis-sdk"
version = "0.1.0"
description = "Praxis Solution Pack SDK — init, validate, and publish solution packs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
praxis-pack = "praxis_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praxis_sdk"]
