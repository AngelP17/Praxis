version: 2
updates:
  # Enable version updates for npm (pnpm monorepo dependencies)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # Enable version updates for Python dependencies at the monorepo root
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # Enable version updates for Astraea Core package
  - package-ecosystem: "pip"
    directory: "/packages/astraea-core"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  # Enable version updates for pipelines package
  - package-ecosystem: "pip"
    directory: "/packages/pipelines"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
