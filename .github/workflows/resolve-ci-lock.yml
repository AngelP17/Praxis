name: Resolve audited dependency lock
on:
  push:
    branches: [fix/post-merge-ci-20261125]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Publish generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: audited-pnpm-lock
          path: pnpm-lock.yaml
      - name: Output generated lockfile for review
        run: |
          echo "LOCKFILE_BEGIN"
          base64 -w 120 pnpm-lock.yaml
          echo "LOCKFILE_END"
