name: Praxis FieldLab Proof

on:
  push:
  pull_request:

jobs:
  fieldlab-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -e packages/astraea-core -e packages/domain -e packages/pipelines
      - name: Run solution pack validation
        run: |
          python scripts/validate_solution_pack.py solution-packs/manufacturing-printer-gpo
      - name: Run FieldLab demo (dry run)
        run: |
          python scripts/run_fieldlab_demo.py --solution-pack manufacturing-printer-gpo
      - name: Run praxis algorithm smoke tests
        run: python scripts/smoke_test_algorithms.py
