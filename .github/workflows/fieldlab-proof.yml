name: Praxis FieldLab Proof

on:
  push:
  pull_request:

jobs:
  fieldlab-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -e packages/astraea-core -e packages/domain -e packages/pipelines
      - name: Run solution pack validation
        run: |
          python scripts/validate_all_solution_packs.py
      - name: Verify Docker is available
        run: docker info > /dev/null 2>&1 || (echo "Docker is not available" && exit 1)
      - name: Pull Floci image
        run: docker pull floci/floci:latest
      - name: Start Floci
        run: |
          cd infrastructure/floci
          docker compose up -d
      - name: Wait for Floci to be healthy
        run: |
          echo "Waiting for Floci to be ready on port 4566..."
          for i in $(seq 1 45); do
            if curl -s http://localhost:4566/_floci/health > /dev/null 2>&1; then
              echo "Floci is healthy."
              exit 0
            fi
            echo "  Attempt $i/45..."
            sleep 2
          done
          echo "Floci did not become healthy in time."
          exit 1
      - name: Run FieldLab demo with proof
        run: |
          python scripts/run_fieldlab_demo.py --solution-pack manufacturing-printer-gpo --emit-proof
      - name: Verify proof
        run: |
          python scripts/verify_praxis_proof.py artifacts/latest/praxis_proof.json
      - name: Determinism gate (re-run + compare hashes)
        run: |
          python scripts/check_replay_determinism.py --solution-pack manufacturing-printer-gpo
      - name: Run benchmarks
        run: |
          python scripts/run_benchmarks.py
      - name: Run praxis algorithm smoke tests
        run: python scripts/smoke_test_algorithms.py
      - name: Sigstore sign the proof artifact
        run: |
          pip install sigstore
          python -m sigstore sign artifacts/latest/praxis_proof.json \
            --output-artifact artifacts/latest/praxis_proof.json.sigstore
        continue-on-error: true
      - name: Stop Floci
        if: always()
        run: |
          cd infrastructure/floci
          docker compose down
