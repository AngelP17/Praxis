name: Bug report
about: Report a bug or unexpected behavior
title: "[BUG] "
labels: bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: How can we reproduce this?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
